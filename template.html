<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Once Human — Build planner / Planificateur de build</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141a1f; --panel:#1c2329; --panel2:#232c34; --line:#2f3a44; --line2:#3d4a56;
  --ink:#e8e2d4; --ink2:#a7b0b8; --ink3:#6f7a85;
  --star:#f2c14e; --teal:#3fb7a9; --red:#e2604f;
  --legendary:#e39b2d; --epic:#b06bf0; --rare:#4f9be8; --uncommon:#6dbe5a; --common:#9aa3ab;
  --fh:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --fb:"Barlow",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:14px;line-height:1.45}
a{color:var(--teal)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block}

/* En-tête */
header{display:flex;align-items:center;gap:20px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
header h1{font-family:var(--fh);font-weight:700;font-size:26px;letter-spacing:.02em;margin:0;color:var(--star)}
header h1 small{display:block;font-family:var(--fb);font-weight:400;font-size:11px;color:var(--ink3);letter-spacing:0}
nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
nav button{background:transparent;border:1px solid transparent;border-radius:4px;padding:7px 12px;color:var(--ink2);font-family:var(--fh);font-size:17px;font-weight:600}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--star);border-color:var(--line2);background:var(--panel2)}
nav .maplink{align-self:center;margin-left:10px;color:var(--teal);text-decoration:none;font-family:var(--fh);font-size:16px;font-weight:600;border:1px solid var(--line2);border-radius:4px;padding:5px 10px}nav .maplink:hover{border-color:var(--teal)}
nav .langsw{display:inline-flex;margin-left:10px;border:1px solid var(--teal);border-radius:4px;overflow:hidden;align-self:center}
nav .langsw button{border:none;border-radius:0;font-size:13px;padding:5px 9px;color:var(--ink2);font-family:var(--fb)}
nav .langsw button.on{background:var(--teal);color:#062a26;font-weight:600}
nav button .n{font-size:11px;color:var(--ink3);margin-left:5px;font-family:var(--fb);font-weight:400}

/* Disposition */
main{display:grid;grid-template-columns:230px 1fr 380px;min-height:calc(100vh - 56px)}
aside.filters{border-right:1px solid var(--line);padding:14px;background:var(--panel)}
aside.filters h3{font-family:var(--fh);font-size:15px;font-weight:600;color:var(--ink2);margin:14px 0 6px}
aside.filters h3:first-child{margin-top:0}
.search{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:4px;padding:8px 10px;color:var(--ink)}
.search:focus{outline:2px solid var(--teal);outline-offset:-1px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:3px 8px;font-size:12px;color:var(--ink2)}
.chip.on{border-color:var(--star);color:var(--star)}
.chip.r-legendary.on{border-color:var(--legendary);color:var(--legendary)}
.chip.r-epic.on{border-color:var(--epic);color:var(--epic)}
.chip.r-rare.on{border-color:var(--rare);color:var(--rare)}
.chip.r-uncommon.on{border-color:var(--uncommon);color:var(--uncommon)}
select.sort{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:4px;padding:7px 8px}

section.list{padding:14px 18px;overflow:auto}
.count{color:var(--ink3);font-size:12px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--common);border-radius:4px;padding:10px;display:grid;grid-template-columns:56px 1fr;gap:10px;cursor:pointer;min-height:84px}
.card:hover{border-color:var(--line2);border-left-color:inherit;background:var(--panel2)}
.card.sel{outline:2px solid var(--teal)}
.card.legendary{border-left-color:var(--legendary)} .card.epic{border-left-color:var(--epic)} .card.rare{border-left-color:var(--rare)} .card.uncommon{border-left-color:var(--uncommon)}
.card img,.thumb{width:56px;height:56px;object-fit:contain;background:#0e1215;border-radius:3px}
.card .t{font-family:var(--fh);font-size:17px;font-weight:600;line-height:1.1}
.card .s{color:var(--ink2);font-size:12px;margin-top:2px}
.card .k{font-size:12px;margin-top:4px;color:var(--ink)}
.card .k b{color:var(--star);font-weight:600}
.card .e{font-size:11px;color:var(--ink3);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Panneau détail */
aside.detail{border-left:1px solid var(--line);background:var(--panel);padding:16px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
.detail .empty{color:var(--ink3);margin-top:40px;text-align:center}
.detail img.big{width:100%;max-height:170px;object-fit:contain;background:#0e1215;border-radius:4px;padding:8px}
.detail h2{font-family:var(--fh);font-size:26px;font-weight:700;margin:12px 0 2px;line-height:1.1}
.detail .sub{color:var(--ink2);margin-bottom:10px}
.rar{font-weight:600}
.rar.legendary{color:var(--legendary)} .rar.epic{color:var(--epic)} .rar.rare{color:var(--rare)} .rar.uncommon{color:var(--uncommon)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px 0}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:6px 8px}
.stat .l{font-size:11px;color:var(--ink3)} .stat .v{font-family:var(--fh);font-size:20px;font-weight:600}
.setimgs{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}.setimgs img,.setimgs .ph{width:44px;height:44px}
.detail h4{font-family:var(--fh);font-size:15px;color:var(--ink2);margin:14px 0 4px;font-weight:600}
.detail p{margin:0 0 6px}
.detail ul{margin:0;padding-left:18px}
.detail .todo{color:var(--ink3);font-style:italic;font-size:12px}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:4px;padding:7px 11px;font-weight:500}
.btn:hover{border-color:var(--star);color:var(--star)}
.btn.primary{background:var(--star);color:#1a1300;border-color:var(--star);font-weight:600}
.btn.primary:hover{background:#ffd268;color:#1a1300}
.btn.danger:hover{border-color:var(--red);color:var(--red)}

/* Build */
.build{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px 18px;grid-column:2/4;align-content:start}
.build h2{font-family:var(--fh);font-size:24px;margin:0 0 6px;font-weight:700;grid-column:1/3}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px;display:grid;grid-template-columns:48px 1fr auto;gap:8px;align-items:center}
.slot.wide{grid-column:1/3}
.slot .lab{font-family:var(--fh);font-size:13px;color:var(--ink3);font-weight:600}
.slot .nm{font-family:var(--fh);font-size:17px;font-weight:600;line-height:1.1}
.slot .nm.none{color:var(--ink3);font-weight:500}
.slot .sm{font-size:12px;color:var(--ink2)}
.slot .sm.mod{color:var(--teal)}
.slot .sm.mod.none{color:var(--ink3);font-style:italic}
.slot img{width:48px;height:48px;object-fit:contain;background:#0e1215;border-radius:3px}
.slot .ph{width:48px;height:48px;background:#0e1215;border-radius:3px;border:1px dashed var(--line2)}
.slot .x{background:none;border:none;color:var(--ink3);font-size:18px;padding:0 4px}
.slot .x:hover{color:var(--red)}
.summary{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px}
.summary h3{font-family:var(--fh);font-size:18px;margin:0 0 8px;font-weight:600;color:var(--star)}
.summary h3+h3, .summary h3.mt{margin-top:16px}
.big3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.big3 .stat .v{font-size:26px}
.summary table{width:100%;border-collapse:collapse;font-size:13px}
.summary td{padding:4px 0;border-bottom:1px solid var(--line);vertical-align:top}
.summary td:first-child{color:var(--ink2);width:34%}
.summary .eff{font-size:12.5px}
.summary .eff b{color:var(--teal);font-weight:600}
.buildbar{grid-column:1/3;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.buildbar input{background:var(--bg);border:1px solid var(--line2);border-radius:4px;padding:7px 10px;min-width:220px}
.buildbar .saved{margin-left:auto;font-size:12px;color:var(--ink3)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--star);color:#1a1300;padding:9px 16px;border-radius:4px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.picking{position:fixed;top:56px;left:0;right:0;background:var(--teal);color:#062a26;padding:6px 20px;font-weight:600;z-index:19;display:flex;gap:12px;align-items:center}
.picking button{background:#062a26;color:var(--teal);border:none;border-radius:3px;padding:3px 10px}
.gauge{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:4px}
.gauge i{display:block;height:100%;background:var(--star)}
.gauge.t i{background:var(--teal)}
@media (max-width:1100px){main{grid-template-columns:200px 1fr}aside.detail{position:fixed;right:0;top:56px;width:380px;max-width:100%;box-shadow:-8px 0 30px #000a;transform:translateX(100%);transition:transform .2s}aside.detail.open{transform:none}.build{grid-column:2/3;grid-template-columns:1fr}.build h2,.slots .slot.wide,.buildbar{grid-column:auto}}
@media (max-width:720px){main{grid-template-columns:1fr}aside.filters{border-right:none;border-bottom:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Once Human<small>Planificateur de build — données Once Human DB</small></h1>
  <nav id="nav"></nav>
</header>
<div id="picking" class="picking" hidden></div>
<main id="main"></main>
<div id="toast" class="toast"></div>

<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const byId = {};
for (const k of ['weapons','armor','mods','deviations','cradle','food','calibrations','skins']) for (const x of D[k]) byId[x.id] = Object.assign(x, {_kind:k});
const setsByName = Object.fromEntries(D.sets.map(s=>[s.name,s]));

// ---------- Langue ----------
function store(k,v){try{localStorage.setItem('oh_'+k,JSON.stringify(v))}catch(e){}}
function restore(k,def){try{const v=localStorage.getItem('oh_'+k);return v?JSON.parse(v):def}catch(e){return def}}

const T = {

    putIn:'Mettre dans :',modTo:'Mod → ',fullSheet:'Fiche complète',picking:'Choisis un élément pour :',pickHint:'— clique sur une carte, puis « Mettre dans cet emplacement ».',cancel:'Annuler',

    w1:'Arme principale',w2:'Arme secondaire',Helmet:'Casque',Mask:'Masque',Top:'Haut',Gloves:'Gants',Bottoms:'Bas',Shoes:'Chaussures',dev:'Déviation de combat',ovr:'Cradle override',cal1:'Calibration arme 1',cal2:'Calibration arme 2',f1:'Nourriture 1',f2:'Nourriture 2',skin:"Peau d'animal",
    empty:'— vide',chooseMod:'+ choisir un mod',choose:'Choisir',remove:'Retirer',buildName:'Nom du build',save:'Enregistrer',load:'Charger un build…',exportB:'Exporter (JSON)',importB:'Importer',copy:'Copier le résumé',clear:'Vider',clearQ:'Vider le build actuel ?',saved:'build(s) enregistré(s)',
    summary:'Résumé',dps1:'DPS arme 1',dps2:'DPS arme 2',hpArmor:'PV armure',off:'Puissance offensive',offN:'effet(s) offensif(s)',def:'Solidité',defN:'effet(s) défensif(s)',armorPieces:"Pièces d'armure",modsEq:'mod(s) équipé(s)',sets:'Sets',noArmor:"Aucune pièce d'armure.",bonusTodo:'bonus à récupérer',active:'Effets actifs',noActive:'Ajoute des armes, mods, déviation ou override.',

    sub:{Helmet:'Casque',Mask:'Masque',Top:'Haut',Gloves:'Gants',Bottoms:'Bas',Shoes:'Chaussures',Weapon:'Arme','Assault Rifle':"Fusil d'assaut",SMG:'PM',LMG:'Mitrailleuse',Shotgun:'Fusil à pompe','Sniper Rifle':'Précision',Pistol:'Pistolet',Crossbow:'Arbalète/Arc',Melee:'Mêlée','Rocket Launcher':'Lance-roquettes',Flamethrower:'Lance-flammes',Combat:'Combat',Territory:'Territoire',Crafting:'Fabrication','Weapon Mod':"Mod d'arme",'Armor Mod':"Mod d'armure"}},
  en:{subtitle:'Build planner — Once Human DB data',build:'My build',weapons:'Weapons',armor:'Armor',mods:'Mods',deviations:'Deviations',cradle:'Overrides',food:'Food',calibrations:'Calibrations',skins:'Skins',

    dmg:'Damage',rpm:'Fire rate',dps:'Theoretical DPS',mag:'Magazine',crit:'Crit rate',critDmg:'Crit DMG',weak:'Weakspot DMG',range:'Range',reload:'Reload',ammo:'Ammo',mode:'Mode',tier:'Tier',pellets:'Pellets',mobility:'Mobility',ads:'ADS',

    hp:'HP',pr:'Pollution resist',weight:'Weight',mod:'Mod',unique:'Key Armor (no set)',uniqueTxt:'This piece has its own effect and no set bonus.',set:'Set',setTodo:'Set bonuses not fetched yet.',setPieces:'Set pieces:',piece:'piece',pieces:'pieces',
    mainEffect:'Main effect',otherVar:'Other variants',varNote:'The variant in <> guarantees a secondary attribute (Precision = Weakspot DMG, Violent = Crit DMG, Survival = HP, Deviant Energy = Psi Intensity…).',where:'Where to get it',

    how:'How it works',how1:'Click « Choose » on a slot, then a card in the list. Build stats update on the right.',how2:'Your builds are saved in this browser. Use « Export » to keep them as a file. Two recommended builds are preloaded in « Load a build… ».',sources:'Sources',sourcesTxt:'Data: oncehumandb.com (extracted from game files), once-human.fandom.com, wikily.gg. Images loaded from the web.',

    summary:'Summary',dps1:'DPS weapon 1',dps2:'DPS weapon 2',hpArmor:'Armor HP',off:'Offensive power',offN:'offensive effect(s)',def:'Toughness',defN:'defensive effect(s)',armorPieces:'Armor pieces',modsEq:'mod(s) equipped',sets:'Sets',noArmor:'No armor piece.',bonusTodo:'bonuses to fetch',active:'Active effects',noActive:'Add weapons, mods, a deviation or an override.',
    note:'Theoretical DPS = damage × fire rate ÷ 60, without crit or effects. Gauges count offensive / defensive keywords in equipped effects: a hint, not an exact in-game calculation.',

    rar:{legendary:'Legendary',epic:'Epic',rare:'Rare',uncommon:'Uncommon',common:'Common'},
    sub:{Helmet:'Helmet',Mask:'Mask',Top:'Top',Gloves:'Gloves',Bottoms:'Bottoms',Shoes:'Shoes',Weapon:'Weapon',SMG:'SMG',LMG:'LMG',Combat:'Combat',Territory:'Territory',Crafting:'Crafting'}}
};
const t = k => T[lang][k] ?? k;
const sub = v => T[lang].sub[v] || v;
const rarL = x => x.rarity ? T[lang].rar[x.rarity] || x.rarity : '';
const eff = x => lang==='en' ? (x.effectEn||x.effect||'') : (x.effect||x.effectEn||'');
function setLang(l){lang=l; store('lang',l); render()}

const TABS = () => [['build',t('build'),null],['optim','⚙ '+ot('tab'),null],['weapons',t('weapons'),D.weapons.length],['armor',t('armor'),D.armor.length],['mods',t('mods'),D.mods.length],['deviations',t('deviations'),D.deviations.length],['cradle',t('cradle'),D.cradle.length],['food',t('food'),D.food.length],['calibrations',t('calibrations'),D.calibrations.length],['skins',t('skins'),D.skins.length]];
const RARITIES = ['legendary','epic','rare','uncommon'];
const SLOTS = [
  {id:'w1',kind:'weapons',mod:'wm1'},{id:'w2',kind:'weapons',mod:'wm2'},
  {id:'Helmet',kind:'armor',mod:'m_Helmet'},{id:'Mask',kind:'armor',mod:'m_Mask'},{id:'Top',kind:'armor',mod:'m_Top'},{id:'Gloves',kind:'armor',mod:'m_Gloves'},{id:'Bottoms',kind:'armor',mod:'m_Bottoms'},{id:'Shoes',kind:'armor',mod:'m_Shoes'},
  {id:'dev',kind:'deviations'},{id:'ovr',kind:'cradle'},{id:'cal1',kind:'calibrations'},{id:'cal2',kind:'calibrations'},{id:'f1',kind:'food'},{id:'f2',kind:'food'},{id:'skin',kind:'skins'}];
const slotLabel = s => t(s.id);
const MODSLOT = {wm1:'Weapon',wm2:'Weapon',m_Helmet:'Helmet',m_Mask:'Mask',m_Top:'Top',m_Gloves:'Gloves',m_Bottoms:'Bottoms',m_Shoes:'Shoes'};

let state = {tab:'build', q:'', rar:new Set(), sub:new Set(), sort:'name', sel:null, pick:null, build:{name:'Build 1'}, builds:{}};
state.builds = restore('builds',{});
state.build = restore('current',{name:'Build 1'});
// Builds recommandés préchargés (ne remplacent jamais un build existant du même nom)
for (const p of (D.presets||[])) { const nm = lang==='en'&&p.name_en ? p.name_en : p.name; if(!state.builds[nm] || state.builds[nm]._preset){ const b=Object.assign({},p); delete b.name_en; b.name=nm; b._preset=true; state.builds[nm]=b; } }
if ((!restore('current',null) || restore('current',{})._preset) && D.presets && D.presets.length) { state.build = Object.assign({}, state.builds[Object.keys(state.builds)[0]]); }

function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(el._h);el._h=setTimeout(()=>el.classList.remove('show'),1600)}
function fandomImg(x){ if(!x||!x.name||!['weapons','armor','deviations'].includes(x._kind)) return null; const n=x.name.replace(/\s*-\s*(Cold|Heat)$/,'').replace(/ /g,'_'); return 'https://once-human.fandom.com/wiki/Special:FilePath/'+encodeURIComponent(n)+'.png'; }
function imgFail(el){ const alt=el.dataset.alt; if(alt){ el.removeAttribute('data-alt'); el.src=alt; return; } el.replaceWith(Object.assign(document.createElement('div'),{className:el.className+' ph'})); }
function img(x,cls){ if(!x||!x.imageUrl) return `<div class="${cls||'thumb'} ph"></div>`; const alt=fandomImg(x); return `<img class="${cls||''}" src="${esc(x.imageUrl)}" ${alt?`data-alt="${esc(alt)}"`:''} alt="" loading="lazy" referrerpolicy="no-referrer" onerror="imgFail(this)">`; }

const SUBF = {weapons:x=>x.type, armor:x=>x.slot, mods:x=>x.slot, deviations:x=>x.type, cradle:x=>x.style, food:x=>x.category, calibrations:()=>null, skins:()=>null};
function subValues(kind){const f=SUBF[kind]; const m=new Map(); for(const x of D[kind]){const v=f(x); if(v) m.set(v,(m.get(v)||0)+1)} return [...m.entries()]}

function filtered(kind){
  const q = state.q.trim().toLowerCase(); const f = SUBF[kind];
  let L = D[kind].filter(x=>{
    if(state.rar.size && x.rarity && !state.rar.has(x.rarity)) return false;
    if(state.sub.size && f(x) && !state.sub.has(f(x))) return false;
    if(q){const hay=[x.name,x.effect,x.effectEn,x.variant,x.set,x.type,x.slot,x.effectName].filter(Boolean).join(' ').toLowerCase(); if(!hay.includes(q)) return false}
    return true;
  });
  const s = state.sort, rk = {legendary:0,epic:1,rare:2,uncommon:3,common:4};
  L.sort((a,b)=>{
    if(s==='name') return a.name.localeCompare(b.name);
    if(s==='rarity') return (rk[a.rarity]??9)-(rk[b.rarity]??9)||a.name.localeCompare(b.name);
    if(s==='damage') return (b.damage||0)-(a.damage||0);
    if(s==='rpm') return (b.rpm||0)-(a.rpm||0);
    if(s==='dps') return (b.dps||b.damage||0)-(a.dps||a.damage||0);
    if(s==='hp') return (+b.hp||0)-(+a.hp||0);
    if(s==='set') return (a.set||'').localeCompare(b.set||'')||a.name.localeCompare(b.name);
    if(s==='variant') return (a.variant||'').localeCompare(b.variant||'')||a.name.localeCompare(b.name);
    return 0;
  });
  return L;
}

function render(){
  document.querySelector('header h1 small').textContent = t('subtitle');
  document.getElementById('nav').innerHTML = TABS().map(([id,l,n])=>`<button class="${state.tab===id?'on':''}" onclick="go('${id}')">${l}${n!=null?`<span class="n">${n}</span>`:''}</button>`).join('')
    + `<a class="maplink" href="resource_map.html" title="Carte des ressources / Resource map">🗺 ${lang==='fr'?'Carte':'Map'}</a><span class="langsw" title="Langue / Language"><button class="${lang==='fr'?'on':''}" onclick="setLang('fr')">FR</button><button class="${lang==='en'?'on':''}" onclick="setLang('en')">EN</button></span>`;
  const p = document.getElementById('picking');
  if(state.pick){p.hidden=false;p.innerHTML=`${t('picking')} <span>${esc(state.pick.label)}</span> ${t('pickHint')} <button onclick="cancelPick()">${t('cancel')}</button>`}
  else p.hidden=true;
  const m = document.getElementById('main');
  if(state.tab==='build'){ m.innerHTML = renderFilters(null) + renderBuild(); return; }
  if(state.tab==='optim'){ m.innerHTML = renderOptimFilters() + renderOptim(); return; }
  m.innerHTML = renderFilters(state.tab) + renderList(state.tab) + renderDetail();
}
function go(tab){state.tab=tab;state.rar.clear();state.sub.clear();state.q='';state.sort='name';state.sel=null;render()}

function renderFilters(kind){
  if(!kind) return `<aside class="filters"><h3>${t('how')}</h3><p style="color:var(--ink2);font-size:13px">${t('how1')}</p><p style="color:var(--ink2);font-size:13px">${t('how2')}</p>
  <h3>${t('sources')}</h3><p style="font-size:12px;color:var(--ink3)">${t('sourcesTxt')}</p>
  <h3>${t('rarity')}</h3><div class="chips">${RARITIES.map(r=>`<span class="chip r-${r} on">${T[lang].rar[r]}</span>`).join('')}</div></aside>`;
  const subs = subValues(kind);
  const sortOpts = {weapons:[['name',t('name')],['rarity',t('rarity')],['damage',t('dmg')],['rpm',t('rpm')],['dps',t('dps')]], armor:[['name',t('name')],['rarity',t('rarity')],['hp',t('hp')],['set',t('set')]], mods:[['name',t('name')],['variant',t('variant')]]}[kind]||[['name',t('name')],['rarity',t('rarity')]];
  const subTitle = {weapons:t('type'),armor:t('slot'),mods:t('slot'),deviations:t('type')}[kind]||t('category');
  return `<aside class="filters">
    <h3>${t('search')}</h3><input class="search" placeholder="${t('searchPh')}" value="${esc(state.q)}" oninput="state.q=this.value;refreshList()">
    <h3>${t('sort')}</h3><select class="sort" onchange="state.sort=this.value;refreshList()">${sortOpts.map(([v,l])=>`<option value="${v}" ${state.sort===v?'selected':''}>${l}</option>`).join('')}</select>
    ${kind!=='mods'&&kind!=='cradle'?`<h3>${t('rarity')}</h3><div class="chips">${RARITIES.map(r=>`<button class="chip r-${r} ${state.rar.has(r)?'on':''}" onclick="tog('rar','${r}')">${T[lang].rar[r]}</button>`).join('')}</div>`:''}
    ${subs.length?`<h3>${subTitle}</h3><div class="chips">${subs.map(([v,n])=>`<button class="chip ${state.sub.has(v)?'on':''}" onclick="tog('sub','${esc(v)}')">${sub(v)} <span style="opacity:.6">${n}</span></button>`).join('')}</div>`:''}
    ${kind==='mods'?`<h3>${t('tip')}</h3><p style="font-size:12px;color:var(--ink3)">${t('modTip')}</p>`:''}
  </aside>`;
}
function tog(set,v){const s=state[set]; s.has(v)?s.delete(v):s.add(v); render()}
function refreshList(){const el=document.querySelector('section.list'); if(el) el.outerHTML=renderList(state.tab)}

function cardStats(x){
  if(x._kind==='weapons') return `<div class="k">${x.damage?`<b>${x.damage}</b> ${lang==='fr'?'dég':'dmg'}`:''}${x.rpm?` · <b>${x.rpm}</b> ${lang==='fr'?'cpm':'rpm'}`:''}${x.dps?` · <b>${x.dps}</b> DPS`:''}${x.mag?` · ${x.mag} ${t('bullets')}`:''}${x.critRate?` · crit ${x.critRate}`:''}</div>`;
  if(x._kind==='armor') return `<div class="k"><b>${x.hp||'?'}</b> ${t('hp')}${x.pollution?` · ${x.pollution} PR`:''} · ${x.set==='Pièce unique'?t('hors'):esc(x.set)}</div>`;
  if(x._kind==='mods') return `<div class="k">${esc(x.variant||'')}</div>`;
  return '';
}
function cardSub(x){
  const r = `<span class="rar ${x.rarity}">${rarL(x)}</span>`;
  if(x._kind==='weapons') return `${sub(x.type)} · ${r}`;
  if(x._kind==='armor') return `${sub(x.slot)} · ${r}`;
  if(x._kind==='mods') return `${sub(x.category)} · ${sub(x.slot)}`;
  if(x._kind==='deviations') return `${sub(x.type)} · ${r}`;
  if(x._kind==='cradle') return sub(x.style);
  return x.rarity?r:'';
}
function renderList(kind){
  const L = filtered(kind);
  return `<section class="list"><p class="count">${L.length} ${t('results')}</p><div class="grid">${L.map(x=>`
    <div class="card ${x.rarity||''} ${state.sel===x.id?'sel':''}" onclick="select('${x.id}')">${img(x)}<div><div class="t">${esc(x.name)}</div><div class="s">${cardSub(x)}</div>${cardStats(x)}${eff(x)?`<div class="e">${esc(eff(x))}</div>`:''}</div></div>`).join('')}</div></section>`;
}
function select(id){state.sel=id; render(); document.querySelector('aside.detail')?.classList.add('open')}

function statBox(l,v){return v==null||v===''?'':`<div class="stat"><div class="l">${l}</div><div class="v">${esc(v)}</div></div>`}
function craftHtml(x){
  if(x.craft&&x.craft.length) return `<h4>${t('craft')}${x.bench?` — ${esc(x.bench)}`:''}</h4><ul>${x.craft.map(c=>`<li>${esc(c.name)} ×${c.qty}</li>`).join('')}</ul>`;
  return `<h4>${t('craft')}</h4><p class="todo">${t('craftTodo')} <a href="${esc(x.url)}" target="_blank" rel="noopener">${t('seeSheet')}</a></p>`;
}
function renderDetail(){
  const x = state.sel && byId[state.sel];
  if(!x) return `<aside class="detail"><p class="empty">${t('selectCard')}</p></aside>`;
  let body = '';
  if(x._kind==='weapons'){
    body += `<div class="stats">${statBox(t('dmg'),x.damage)}${statBox(t('rpm'),x.rpm?x.rpm+(lang==='fr'?' cpm':' rpm'):null)}${statBox(t('dps'),x.dps)}${statBox(t('mag'),x.mag)}${statBox(t('crit'),x.critRate)}${statBox(t('critDmg'),x.critDmg)}${statBox(t('weak'),x.weakspotDmg)}${statBox(t('range'),x.rangeEff||x.range)}${statBox(t('reload'),x.reloadSec||x.reload)}${statBox(t('ammo'),x.ammo)}${statBox(t('mode'),x.fireMode)}${statBox(t('tier'),x.tier?'T'+x.tier:null)}${statBox(t('pellets'),x.pellets)}${statBox(t('mobility'),x.mobility)}${statBox(t('ads'),x.ads)}</div>${x.falloff?`<p style="font-size:12px;color:var(--ink3)">${t('falloff')} ${esc(x.falloff)}</p>`:''}`;
    body += eff(x)?`<h4>${t('effect')}${x.effectName?` — ${esc(x.effectName)}`:''}</h4><p>${esc(eff(x))}</p>`:`<h4>${t('effect')}</h4><p class="todo">${x.detailed?t('noEffect'):t('notFetched')}</p>`;
    if(x.description) body += `<p style="color:var(--ink2)">${esc(x.description)}</p>`;
    if(x.note) body += `<p class="todo">${esc(x.note)}</p>`;
    body += craftHtml(x);
    if(x.overrides&&x.overrides.length) body += `<h4>${t('overrides')}</h4><p>${x.overrides.map(esc).join(', ')}</p>`;
  } else if(x._kind==='armor'){
    const s = setsByName[x.set];
    body += `<div class="stats">${statBox(t('hp'),x.hp)}${statBox(t('pr'),x.pollution)}${statBox(t('weight'),x.weight)}${statBox(t('mod'),x.modSlot)}</div>`;
    if(x.set==='Pièce unique') body += `<h4>${t('unique')}</h4><p class="todo">${t('uniqueTxt')}</p>`;
    else { body += `<h4>${t('set')} : ${esc(x.set)}</h4>${s&&s.bonus.length?`<ul>${s.bonus.map(b=>`<li><b>${b.pieces} ${b.pieces>1?t('pieces'):t('piece')} :</b> ${esc(b.effect)}</li>`).join('')}</ul>`:`<p class="todo">${t('setTodo')}</p>`}`;
      body += `<p style="font-size:12px;color:var(--ink3)">${t('setPieces')} ${s?s.pieces.map(id=>`<a href="#" onclick="select('${id}');return false">${sub(byId[id].slot)}</a>`).join(', '):''}</p>`;
      if(s) body += `<div class="setimgs">${s.pieces.map(id=>`<a href="#" title="${esc(byId[id].name)}" onclick="select('${id}');return false">${img(byId[id])}</a>`).join('')}</div>`; }
    if(eff(x)) body += `<h4>${t('effect')}</h4><p>${esc(eff(x))}</p>`;
    body += craftHtml(x);
  } else if(x._kind==='mods'){
    body += `<div class="stats">${statBox(t('slot'),sub(x.slot))}${statBox(t('variant'),x.variant)}</div><h4>${t('mainEffect')}</h4><p>${esc(x.effect)}</p>`;
    const sib = D.mods.filter(m=>m.name===x.name&&m.id!==x.id);
    if(sib.length) body += `<h4>${t('otherVar')}</h4><p>${sib.map(m=>`<a href="#" onclick="select('${m.id}');return false">${esc(m.variant)}</a>`).join(' · ')}</p>`;
    body += `<p style="font-size:12px;color:var(--ink3)">${esc(t('varNote'))}</p>`;
  } else {
    body += `${x.type||x.style||x.category?`<div class="stats">${statBox(t('type'),sub(x.type||x.style||x.category))}${statBox(t('weight'),x.weight?x.weight+' kg':null)}</div>`:''}<h4>${t('effect')}</h4><p>${esc(eff(x)||x.description||'')}</p>${x.location?`<h4>${t('where')}</h4><p>${esc(x.location)}</p>`:''}${x.note?`<p class="todo">${esc(x.note)}</p>`:''}`;
  }
  let acts = '';
  if(state.pick && state.pick.kind===x._kind && (!state.pick.slot || state.pick.slot===x.slot)) acts += `<button class="btn primary" onclick="put('${state.pick.id}','${x.id}')">${t('putIn')} ${esc(state.pick.label)}</button>`;
  const targets = SLOTS.filter(s=>s.kind===x._kind && (x._kind!=='armor' || s.id===x.slot)).map(s=>({id:s.id,label:slotLabel(s)}));
  if(x._kind==='mods') for(const [k,sl] of Object.entries(MODSLOT)) if(sl===x.slot) targets.push({id:k,label:t('modTo')+slotLabel(SLOTS.find(s=>s.mod===k))});
  for(const tg of targets) if(!(state.pick&&state.pick.id===tg.id)) acts += `<button class="btn" onclick="put('${tg.id}','${x.id}')">→ ${esc(tg.label)}</button>`;
  return `<aside class="detail open">${img(x,'big')}<h2>${esc(x.name)}</h2><div class="sub">${cardSub(x)}</div>${body}<div class="actions">${acts}<a class="btn" href="${esc(x.url)}" target="_blank" rel="noopener">${t('fullSheet')}</a></div></aside>`;
}

// ---------- Build ----------
function put(slot,id){state.build[slot]=id; state.pick=null; store('current',state.build); toast(t('added')+byId[id].name); state.tab='build'; render()}
function clearSlot(slot){delete state.build[slot]; const s=SLOTS.find(s=>s.id===slot); if(s&&s.mod) delete state.build[s.mod]; store('current',state.build); render()}
function pick(slotId){const s=SLOTS.find(s=>s.id===slotId);
  if(s){state.pick={id:s.id,label:slotLabel(s),kind:s.kind,slot:s.kind==='armor'?s.id:null}; state.sub=new Set(s.kind==='deviations'?['Combat']:s.kind==='armor'?[s.id]:[]); state.tab=s.kind}
  else {const sl=MODSLOT[slotId]; const parent=SLOTS.find(s=>s.mod===slotId); state.pick={id:slotId,label:t('modTo')+slotLabel(parent),kind:'mods',slot:sl}; state.sub=new Set([sl]); state.tab='mods'}
  state.rar.clear(); state.q=''; state.sel=null; render()}
function cancelPick(){state.pick=null;render()}

function buildStats(){
  const b = state.build, get=k=>b[k]&&byId[b[k]];
  const w1=get('w1'), w2=get('w2');
  const armorPieces = ['Helmet','Mask','Top','Gloves','Bottoms','Shoes'].map(get).filter(Boolean);
  const hp = armorPieces.reduce((s,a)=>s+(+a.hp||0),0);
  const sets = {}; for(const a of armorPieces) if(a.set!=='Pièce unique') sets[a.set]=(sets[a.set]||0)+1;
  const mods = Object.keys(MODSLOT).map(get).filter(Boolean);
  const effects=[];
  for(const m of mods) effects.push({src:m.name+' <'+m.variant+'>',t:m.effect});
  for(const w of [w1,w2]) if(w&&eff(w)) effects.push({src:w.name,t:eff(w)});
  for(const a of armorPieces) if(a.set==='Pièce unique'&&eff(a)) effects.push({src:a.name,t:eff(a)});
  for(const k of ['dev','ovr','f1','f2','skin']){const x=get(k); if(x&&eff(x)) effects.push({src:x.name,t:eff(x)})}
  for(const [n,c] of Object.entries(sets)){const s=setsByName[n]; if(s) for(const bo of s.bonus) if(c>=bo.pieces) effects.push({src:`Set ${n} (${bo.pieces})`,t:bo.effect})}
  const txt = effects.map(e=>(e.t||'').toLowerCase()).join(' ');
  const off = (txt.match(/dmg|damage|dég|crit|weakspot|point faible|shrapnel|burn|frost|power surge|bounce|bull's eye|fortress|unstable bomber|fast gunner|attaque|attack/g)||[]).length;
  const def = (txt.match(/\bhp\b|\bpv\b|health|shield|bouclier|dmg reduction|réduction de dég|resist|recover|récup|heal|soin|barrier/g)||[]).length;
  return {w1,w2,hp,sets,effects,off,def,armorPieces,mods};
}
function renderBuild(){
  const b = state.build, st = buildStats();
  const slot = (s)=>{const x=b[s.id]&&byId[b[s.id]]; const mod=s.mod&&b[s.mod]&&byId[b[s.mod]];
    return `<div class="slot ${s.kind==='weapons'?'wide':''}">${img(x)}<div><div class="lab">${esc(slotLabel(s))}</div>
      <div class="nm ${x?'':'none'}">${x?esc(x.name):t('empty')}</div>
      ${x&&s.kind==='weapons'?`<div class="sm">${x.damage} ${lang==='fr'?'dég':'dmg'} · ${x.rpm||'—'} ${lang==='fr'?'cpm':'rpm'}${x.dps?` · ${x.dps} DPS`:''}</div>`:''}
      ${x&&s.kind==='armor'?`<div class="sm">${x.hp} ${t('hp')} · ${x.set==='Pièce unique'?t('hors'):esc(x.set)}</div>`:''}
      ${s.mod?`<div class="sm mod ${mod?'':'none'}" style="cursor:pointer" onclick="pick('${s.mod}')">${mod?`${t('mod')} : ${esc(mod.name)} &lt;${esc(mod.variant)}&gt;`:t('chooseMod')}</div>`:''}
    </div><div><button class="btn" onclick="pick('${s.id}')">${t('choose')}</button>${x?`<button class="x" title="${t('remove')}" onclick="clearSlot('${s.id}')">×</button>`:''}</div></div>`};
  const dps = w => w? (w.dps||w.damage||0):0;
  const setRows = Object.entries(st.sets).sort((a,b)=>b[1]-a[1]).map(([n,c])=>{const s=setsByName[n]; const bon=s&&s.bonus.length?s.bonus.map(bo=>`<span style="color:${c>=bo.pieces?'var(--teal)':'var(--ink3)'}">${bo.pieces}p</span>`).join(' '):`<span class="todo" style="font-size:11px">${t('bonusTodo')}</span>`; return `<tr><td>${esc(n)}</td><td><b>${c}</b> ${c>1?t('pieces'):t('piece')} ${bon}</td></tr>`}).join('');
  const maxS = Math.max(6, st.off, st.def);
  return `<section class="build">
    <h2>${t('build')}${b._preset?` <span style="font-size:13px;color:var(--teal);font-family:var(--fb);font-weight:500">· ${t('preset')}</span>`:''}</h2>
    <div class="buildbar"><input value="${esc(b.name||'')}" placeholder="${t('buildName')}" oninput="state.build.name=this.value;store('current',state.build)">
      <button class="btn primary" onclick="saveBuild()">${t('save')}</button>
      <select class="sort" style="width:auto" onchange="loadBuild(this.value)"><option value="">${t('load')}</option>${Object.keys(state.builds).map(n=>`<option>${esc(n)}</option>`).join('')}</select>
      <button class="btn" onclick="exportBuilds()">${t('exportB')}</button>
      <label class="btn">${t('importB')}<input type="file" accept=".json" hidden onchange="importBuilds(this.files[0])"></label>
      <button class="btn" onclick="copyText()">${t('copy')}</button>
      <button class="btn danger" onclick="if(confirm('${t('clearQ')}')){state.build={name:state.build.name};store('current',state.build);render()}">${t('clear')}</button>
      <span class="saved">${Object.keys(state.builds).length} ${t('saved')}</span></div>
    <div class="slots">${SLOTS.map(slot).join('')}</div>
    <div class="summary">
      <h3>${t('summary')}</h3>
      <div class="big3">${statBox(t('dps1'),dps(st.w1)||'—')}${statBox(t('dps2'),dps(st.w2)||'—')}${statBox(t('hpArmor'),st.hp||'—')}</div>
      <table style="margin-top:8px"><tr><td>${t('off')}</td><td>${st.off} ${t('offN')}<div class="gauge"><i style="width:${Math.min(100,st.off/maxS*100)}%"></i></div></td></tr>
      <tr><td>${t('def')}</td><td>${st.def} ${t('defN')}<div class="gauge t"><i style="width:${Math.min(100,st.def/maxS*100)}%"></i></div></td></tr>
      <tr><td>${t('armorPieces')}</td><td>${st.armorPieces.length}/6 · ${st.mods.length} ${t('modsEq')}</td></tr></table>
      <h3 class="mt">${t('sets')}</h3>${setRows?`<table>${setRows}</table>`:`<p class="todo">${t('noArmor')}</p>`}
      <h3 class="mt">${t('active')}</h3>${st.effects.length?st.effects.map(e=>`<p class="eff"><b>${esc(e.src)}</b> — ${esc(e.t)}</p>`).join(''):`<p class="todo">${t('noActive')}</p>`}
      <p style="font-size:11.5px;color:var(--ink3);margin-top:12px">${t('note')}</p>
    </div></section>`;
}
function saveBuild(){const n=(state.build.name||'').trim()||'Build'; state.build.name=n; delete state.build._preset; state.builds[n]=JSON.parse(JSON.stringify(state.build)); store('builds',state.builds); store('current',state.build); toast(t('savedT')+n); render()}
function loadBuild(n){if(!n) return; state.build=JSON.parse(JSON.stringify(state.builds[n])); store('current',state.build); render()}
function exportBuilds(){const all=Object.assign({},state.builds); all[state.build.name||'current']=state.build; const a=document.createElement('a'); a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(all,null,2)); a.download='once_human_builds.json'; a.click()}
function importBuilds(f){if(!f) return; f.text().then(x=>{try{const o=JSON.parse(x); Object.assign(state.builds,o); store('builds',state.builds); toast(t('imported')); render()}catch(e){toast(t('invalid'))}})}
function copyText(){const b=state.build,g=k=>b[k]&&byId[b[k]]; const lines=[`Build : ${b.name||''}`]; for(const s of SLOTS){const x=g(s.id); if(x){let l=`${slotLabel(s)} : ${x.name}`; if(s.mod&&g(s.mod)) l+=`  [mod ${g(s.mod).name} <${g(s.mod).variant}>]`; lines.push(l)}} const st=buildStats(); lines.push(`${t('hpArmor')} : ${st.hp}`,`${t('sets')} : ${Object.entries(st.sets).map(([n,c])=>n+' x'+c).join(', ')}`); navigator.clipboard?.writeText(lines.join('\n')).then(()=>toast(t('copied')))}

// =====================================================================
//  OPTIMISEUR — moteur de score dépendant de l'arme sélectionnée
// =====================================================================
const OPT = (function(){

  // ---------- Mécaniques (mots-clés) ----------
  const KW = {
    shrapnel:  {re:/shrapnel/i,                         fam:'weapon', fr:'Shrapnel',          en:'Shrapnel',        variant:'Shrapnel'},
    bounce:    {re:/bounce/i,                           fam:'weapon', fr:'Rebond',            en:'Bounce',          variant:'Bounce'},
    bullseye:  {re:/bull'?s eye|marked|mark /i,         fam:'weapon', fr:'Dans le mille',     en:"The Bull's Eye",  variant:"The Bull's Eye"},
    fastgunner:{re:/fast gunner/i,                      fam:'weapon', fr:'Tireur rapide',     en:'Fast Gunner',     variant:'Fast Gunner'},
    fortress:  {re:/fortress warfare/i,                 fam:'weapon', fr:'Lutte retranchée',  en:'Fortress Warfare',variant:'Fortress Warfare'},
    burn:      {re:/\bburn|blaze|burning/i,             fam:'status', fr:'Brûlure',           en:'Burn',            variant:'Burn'},
    surge:     {re:/power surge|\bshock/i,              fam:'status', fr:'Surtension',        en:'Power Surge',     variant:'Power Surge'},
    vortex:    {re:/frost vortex|frost construct|ice crystal|ice spike|\bfrost|frozen/i, fam:'status', fr:'Vortex de givre', en:'Frost Vortex', variant:'Frost Vortex'},
    bomber:    {re:/unstable bomber|\bbomb|explosion dmg|\bblast/i, fam:'status', fr:'Bombe instable', en:'Unstable Bomber', variant:'Unstable Bomber'},
  };
  const KW_ORDER = ['shrapnel','bounce','bullseye','fastgunner','fortress','burn','surge','vortex','bomber'];

  // Taux de coups au point faible selon le type d'arme (hypothèse de jeu propre)
  const WHR = {'Sniper Rifle':.85,'Crossbow':.8,'Pistol':.55,'Assault Rifle':.5,'SMG':.4,'LMG':.35,'Shotgun':.3,'Melee':.2,'Rocket Launcher':.1,'Flamethrower':.05};

  const STATS = ['wd','fr','cr','cd','ws','st','kw','hp','dr','rel','mel','mob'];
  const STAT_LABEL = {
    fr:{wd:"Dég d'arme / Attaque",fr:'Cadence',cr:'Taux crit',cd:'Dég crit',ws:'Point faible',st:'Statut / élémentaire / Psi',kw:'Dég de la mécanique',hp:'PV max',dr:'Réduction / bouclier / soin',rel:'Rechargement / chargeur',mel:'Mêlée',mob:'Mobilité / utilitaire'},
    en:{wd:'Weapon DMG / Attack',fr:'Fire rate',cr:'Crit rate',cd:'Crit DMG',ws:'Weakspot',st:'Status / elemental / Psi',kw:'Mechanic DMG',hp:'Max HP',dr:'Reduction / shield / heal',rel:'Reload / magazine',mel:'Melee',mob:'Mobility / utility'}
  };

  const GOALS = [
    ['dps',     {fr:'DPS global (le plus destructeur)', en:'Overall DPS (most destructive)'}],
    ['critdmg', {fr:'Dégâts critiques',               en:'Crit damage'}],
    ['critrate',{fr:'Taux de coup critique',          en:'Crit rate'}],
    ['weakspot',{fr:'Dégâts au point faible',         en:'Weakspot damage'}],
    ['elem',    {fr:'Élémentaire / statut',           en:'Elemental / status'}],
    ['keyword', {fr:"Dégâts de la mécanique de l'arme", en:"Weapon mechanic damage"}],
    ['survival',{fr:'Survie (PV / réduction)',        en:'Survival (HP / reduction)'}],
  ];

  // ---------- Détection de la mécanique d'une arme ----------
  function detectKw(w){
    const txt = [w.effectName, w.effectEn, w.effect].filter(Boolean).join(' ');
    // ordre de priorité : le nom d'effet explicite d'abord
    if (w.effectName) for (const k of KW_ORDER) if (KW[k].re.test(w.effectName)) return k;
    for (const k of KW_ORDER) if (KW[k].re.test(txt)) return k;
    return null;
  }
  function num(x){ if(x==null||x==='') return null; const n=parseFloat(String(x).replace(',','.')); return isNaN(n)?null:n; }

  // Profil de l'arme : ce qui compte vraiment pour elle
  function profile(w, kwOverride){
    const kw = kwOverride==='none' ? null : (kwOverride && kwOverride!=='auto' ? kwOverride : detectKw(w));
    const fam = kw ? KW[kw].fam : 'weapon';
    const whr = w.type==='Melee' ? .2 : (WHR[w.type] ?? .4);
    const cr0 = ((num(w.critRate) ?? 5) + 5)/100;          // crit de l'arme + base perso
    const cd0 = ((num(w.critDmg) ?? 25) + 50)/100;         // dég crit de l'arme + base perso
    const ws0 = ((num(w.weakspotDmg) ?? 40))/100;
    return {w, kw, fam, whr, cr0, cd0, ws0, melee: w.type==='Melee', detected: !kwOverride || kwOverride==='auto'};
  }

  // Poids par statistique = objectif × mécanique de l'arme × stats de base
  function weights(p, goal){
    const W = {}; STATS.forEach(s=>W[s]=0);
    // valeur marginale DPS de chaque stat pour CETTE arme (dérivée relative)
    // on raisonne avec un équipement « moyen » déjà en place (≈ +25 % crit, +35 % dég crit, +30 % point faible)
    const crE = Math.min(.9, p.cr0+.25), cdE = p.cd0+.35, wsE = p.ws0+.3;
    const crit = 1 + crE*cdE;
    const mCd = crE/crit, mCr = cdE/crit, mWs = p.whr/(1+p.whr*wsE);
    if (p.fam==='status'){
      // l'essentiel des dégâts vient de la mécanique (Intensité Psi) : balles secondaires
      Object.assign(W,{st:1.0, kw:1.25, wd:.18, fr:.15, cr:.05, cd:.05, ws:.05, rel:.12});
      if (p.kw==='bomber') { W.cr=.25; W.cd=.15; }             // Bombe instable peut critiquer
      if (p.kw==='surge')  { W.cr=.15; W.cd=.15; }             // certaines Surtension critiquent
    } else {
      Object.assign(W,{wd:1.0, fr:.9, cr:2.2*mCr, cd:2.2*mCd, ws:2.2*mWs, kw: p.kw?1.15:0, st:.05, rel:.25});
      if (p.kw==='shrapnel'){ W.cr*=1.2; W.cd*=1.2; W.ws*=1.2; } // Shrapnel crit & touche les points faibles
      if (p.kw==='bounce')  { W.ws*=1.15; }
      if (p.kw==='fortress'){ W.dr=.35; W.hp=.25; }
    }
    if (p.melee){ W.mel = 1.1; W.ws*=.5; W.fr=.1; }
    W.hp = Math.max(W.hp,.08); W.dr = Math.max(W.dr,.1); W.mob=.03;
    const G = {
      dps:     s=>s,
      critdmg: s=>({...s, cd:s.cd*3+.8, cr:s.cr*1.6+.3, wd:s.wd*.4, fr:s.fr*.3, ws:s.ws*.3, st:s.st*.3, kw:s.kw*.5}),
      critrate:s=>({...s, cr:s.cr*3+.8, cd:s.cd*1.2+.2, wd:s.wd*.4, fr:s.fr*.3, ws:s.ws*.3, st:s.st*.3, kw:s.kw*.5}),
      weakspot:s=>({...s, ws:s.ws*3+.9, wd:s.wd*.5, fr:s.fr*.4, cr:s.cr*.5, cd:s.cd*.5, st:s.st*.3, kw:s.kw*.5}),
      elem:    s=>({...s, st:s.st*2.5+.9, kw:p.fam==='status'?s.kw*1.6:s.kw*.4, wd:s.wd*.25, fr:s.fr*.2, cr:s.cr*.3, cd:s.cd*.3, ws:s.ws*.3}),
      keyword: s=>({...s, kw:(s.kw||.5)*3, wd:s.wd*.6, st:s.st*.8}),
      survival:s=>({...s, hp:1.6, dr:1.8, rel:.3, mob:.15, wd:s.wd*.15, fr:s.fr*.1, cr:s.cr*.1, cd:s.cd*.1, ws:s.ws*.1, st:s.st*.15, kw:s.kw*.25, mel:(s.mel||0)*.2}),
    };
    return (G[goal]||G.dps)(W);
  }

  // ---------- Lecture d'un effet (texte anglais des fichiers du jeu) ----------
  const COND = /\b(when|after|while|if|for \d+(\.\d+)?s|every|upon|each time|triggering|below|above)\b/i;
  function kwOf(text){ const f=[]; for (const k of KW_ORDER) if (KW[k].re.test(text)) f.push(k); return f; }

  function parse(text, p){
    const out = {}; const why = [];
    if (!text) return {out, why, off:false};
    let t = ' '+text.replace(/\s+/g,' ')+' ';
    const add = (s,v,label)=>{ if(!v) return; out[s]=(out[s]||0)+v; why.push([s,v,label]); };
    // Mécaniques mentionnées
    const kws = kwOf(t).filter(k=>!(k==='bullseye' && /marked enemies dmg vs/i.test(t)));
    const own = p.kw && kws.includes(p.kw);
    const foreign = kws.filter(k=>k!==p.kw);
    // « marked » seul ne compte pas comme mécanique étrangère sans Bull's Eye explicite
    const strictForeign = foreign.filter(k=>!(k==='bullseye' && !/bull'?s eye/i.test(t)) && !(k==='vortex' && /frost resist/i.test(t)) && !(k==='burn' && /burn resist|heat/i.test(t)));
    if (strictForeign.length && !own) return {out:{}, why:[], off:true, foreign:strictForeign};
    let cond = COND.test(t) ? .7 : 1;
    // conditions contraignantes : accroupi immobile, non repéré, hors combat, PV bas…
    if (/crouch|immobile|not spotted|no enemies within|taking no dmg|out of combat|hp is below|below 30%|while airborne|in the air/i.test(t)) cond = .4;
    else if (/(?:hp|stamina) is (?:above|over)|above \d+% hp|enemy above \d+% hp/i.test(t)) cond = Math.min(cond,.55);
    if (/marked|mark(?:ed)? enem|the bull'?s eye/i.test(t) && p.kw!=='bullseye') cond *= .15;      // il faut une arme qui marque
    if (/shielded enemy|hitting a shield/i.test(t)) cond *= .4;
    if (p.melee && /bullet|magazine|reload|fire rate|weakspot/i.test(t) && !/melee/i.test(t)) cond *= .2;   // arme de mêlée
    if (/after (?:killing|defeating|getting \d+ kill)|upon (?:kill|defeat)|killing enem|precise kill|kill(?:s)? (?:an|\d)|when (?:defeating|a marked enemy is defeated)/i.test(t)) cond *= .6;
    // durée courte : « for 2s »
    const durM = t.match(/for (\d+(?:\.\d+)?)\s?s\b/i); if (durM){ const d=+durM[1]; if (d<=2) cond*=.35; else if (d<=4) cond*=.6; else if (d<=8) cond*=.85; }
    // « les N premiers coups » : proportion du chargeur
    const firstM = t.match(/first (\w+) hits?/i); if (firstM){ const n={one:1,two:2,three:3,four:4,five:5}[firstM[1].toLowerCase()]||+firstM[1]||3; cond*=Math.min(1,n/((p.w&&p.w.mag)||30)*1.5); }
    // plafonds « up to X% »
    const capM = t.match(/up to \+?(\d+(?:\.\d+)?)%/i);
    const stackM = t.match(/(?:up to|stack(?:s)? up to|stack(?:s)?) (\d+) (?:time|stack)/i) || t.match(/up to (\d+) stack/i);
    const stackN = stackM ? +stackM[1] : 0;
    const stackF = stackN ? Math.min(stackN,5)*.55 : 1;
    // valeurs « par stack » inversées : « grants 1% Elemental DMG … up to 20 stacks »
    t = t.replace(/(?:grants?|gain|gains)\s+(\d+(?:\.\d+)?)% (elemental|element|status|weapon|crit(?:ical)?|weakspot) (?:dmg|damage)/gi,(m,v,k)=>{
      const f = stackN ? Math.min(stackN,30)*.55 : 1; const val=+v*f*cond; const map={elemental:'st',element:'st',status:'st',weapon:'wd',crit:'cd',critical:'cd',weakspot:'ws'};
      add(map[k.toLowerCase()],val,'stacks'); return ' '; });

    // Réductions de dégâts (avant les dégâts pour ne pas les confondre)
    t = t.replace(/((?:weapon |status |head |torso |weakspot |deviant |blast |explosion |melee )?dmg reduction|damage reduction|dmg taken -|dmg received -)\s*\+?(\d+(?:\.\d+)?)%?/gi,(m,a,v)=>{ add('dr',+v*cond,'réduction'); return ' '; });
    t = t.replace(/(dmg reduction|damage reduction) fluctuates[^.]*?(\d+)/gi,(m,a,v)=>{ add('dr',+v*.5,'réduction'); return ' '; });
    t = t.replace(/(\d+(?:\.\d+)?)% less (?:damage|dmg) to you/gi,(m,v)=>{ add('dr',+v*.15,'réduction'); return ' '; });
    // « pour chaque 1 % de taux crit, dégâts de la mécanique +0,5 % »
    t = t.replace(/for every 1% crit rate,?[^.+]{0,40}?\+\s*(\d+(?:\.\d+)?)%/gi,(m,v)=>{ add(own?'kw':'wd',+v*35,'selon le crit'); return ' '; });
    // Boucliers / soins
    t = t.replace(/shield (?:equal to|of) (\d+(?:\.\d+)?)% of (?:max )?hp/gi,(m,v)=>{ add('dr',+v*.6*cond,'bouclier'); return ' '; });
    t = t.replace(/(?:recover|restore|heal(?:s|ing)?)\s*(\d+(?:\.\d+)?)% (?:of )?(?:max )?hp/gi,(m,v)=>{ add('dr',+v*.5*cond,'soin'); return ' '; });
    if (/healing received|treatment in the backpack|lowest-grade treatment|revive/i.test(t)) add('dr',4*cond,'soin');
    // PV
    t = t.replace(/(?:max )?hp\s*\+\s*(\d+(?:\.\d+)?)%/gi,(m,v)=>{ add('hp',+v*cond,'PV %'); return ' '; });
    t = t.replace(/\bhp\s*\+\s*(\d{3,})/gi,(m,v)=>{ add('hp',+v/120,'PV'); return ' '; });
    // Listes « Melee, Weapon, and Status DMG +X% »
    t = t.replace(/((?:melee|weapon|status|elemental)(?:,? (?:and )?(?:melee|weapon|status|elemental))+) dmg\s*\+\s*(\d+(?:\.\d+)?)%/gi,(m,list,v)=>{
      const val=+v*cond*(capM&&+capM[1]>+v? Math.min(+capM[1]/+v,3)*.6:1);
      if(/weapon/i.test(list)) add('wd',val,'dég d\'arme'); if(/status|elemental/i.test(list)) add('st',val,'statut'); if(/melee/i.test(list)) add('mel',val,'mêlée'); return ' '; });
    // Crit
    t = t.replace(/crit(?:ical)? rate\s*\+\s*(\d+(?:\.\d+)?)%/gi,(m,v)=>{ add(own && /(shrapnel|bounce|power surge|bomber)[^.]{0,20}crit rate/i.test(text)?'kw':'cr',+v*cond*stackF,'crit'); return ' '; });
    t = t.replace(/crit(?:ical)? (?:dmg|damage)\s*\+\s*(\d+(?:\.\d+)?)%/gi,(m,v)=>{ add('cd',+v*cond*stackF,'dég crit'); return ' '; });
    t = t.replace(/\+(\d+(?:\.\d+)?)% crit(?:ical)? (?:dmg|damage)/gi,(m,v)=>{ add('cd',+v*cond*stackF,'dég crit'); return ' '; });
    // Point faible
    t = t.replace(/weakspot (?:dmg|damage)\s*\+\s*(\d+(?:\.\d+)?)%/gi,(m,v)=>{ add('ws',+v*cond*stackF,'point faible'); return ' '; });
    if (/cannot deal weakspot/i.test(text)) add('ws',-60,'aucun point faible');
    // Élémentaire / statut / Psi
    t = t.replace(/(?:element(?:al)? dmg|status dmg|psi intensity(?: dmg)?|blaze dmg|frost dmg|shock dmg|blast dmg)(?: \([^)]*\))?\s*\+\s*(\d+(?:\.\d+)?)%/gi,(m,v)=>{ add('st',+v*cond*stackF,'statut'); return ' '; });
    t = t.replace(/(?:blaze|frost|shock|explosion|weapon) dmg received by (\d+(?:\.\d+)?)%/gi,(m,v)=>{ add(/weapon/i.test(m)?'wd':'st',+v*.8,'vulnérabilité'); return ' '; });
    // Mêlée (avant les dégâts génériques)
    t = t.replace(/melee (?:dmg|damage)\s*\+\s*(\d+(?:\.\d+)?)%/gi,(m,v)=>{ add('mel',+v*cond,'mêlée'); return ' '; });
    // Dégâts propres à une mécanique (Shrapnel DMG +60 %, Bounce DMG +125 %…)
    t = t.replace(/(shrapnel|bounce|power surge|unstable bomber|bomb's|bomb|frost vortex|frost construct\w*|burn)((?:'s)?[^.+]{0,30}?)(?:dmg|damage)([^.+]{0,12}?)\+\s*(\d+(?:\.\d+)?)%/gi,(m,a,b,c,v)=>{ if(own) add('kw',+v*cond*stackF,'mécanique'); return ' '; });
    // Dégâts d'arme / attaque
    t = t.replace(/(?:weapon dmg|weapon damage|attack|final dmg|bullet's final dmg|dmg dealt|dmg)\s*\+\s*(\d+(?:\.\d+)?)%/gi,(m,v)=>{
      add('wd',+v*cond*stackF,'dég d\'arme'); return ' '; });
    t = t.replace(/vulnerability\s*\+\s*(\d+(?:\.\d+)?)%/gi,(m,v)=>{ add('wd',+v*cond,'vulnérabilité'); return ' '; });
    // Cadence, rechargement, chargeur
    t = t.replace(/fire rate\s*\+\s*(\d+(?:\.\d+)?)%/gi,(m,v)=>{ add('fr',+v*cond,'cadence'); return ' '; });
    t = t.replace(/(?:magazine capacity|reload efficiency|reload speed)\s*\+\s*(\d+(?:\.\d+)?)%/gi,(m,v)=>{ add('rel',+v*cond,'rechargement'); return ' '; });
    if (/refill|reload \d+|automatically reload|infinite ammo|consume reserve/i.test(t)) add('rel',8*cond,'munitions');
    // Mobilité / utilitaire
    if (/movement speed|sprint speed|stamina|max load|jump height|roll/i.test(t)) add('mob',8,'utilitaire');
    if (/gathering|logging|mining|max load \+\d/i.test(t)) add('mob',6,'récolte');
    // Effets de la mécanique sans chiffre (déclenchements, rebonds, stacks…)
    if (own){
      const counts = text.match(/(?:trigger count|bounces|trigger(?:s)? .{0,10}time|hit part|max .{0,20}stack(?:s)?|stacks)\s*\+\s*(\d+)/gi);
      if (counts) counts.forEach(c=>{ const n=+c.match(/(\d+)\s*$/)[1]; add('kw',n*12,'déclenchements'); });
      if (!out.kw && capM) add('kw',+capM[1]*.6*cond,'jusqu\'au plafond');
      if (!Object.keys(out).length){ const nums=[...text.matchAll(/(\d+(?:\.\d+)?)%/g)].map(x=>+x[1]).filter(x=>x<=300); add('kw',(nums.length?Math.max(...nums)*.25:8)*cond,'renforce la mécanique'); }
      else if (!out.kw) add('kw',3,'synergie mécanique');
    }
    return {out, why, off:false};
  }

  function scoreOf(parsed, W){ let s=0; for (const k in parsed.out) s += (W[k]||0)*parsed.out[k]; return s; }
  function explain(parsed, W){
    const L = STAT_LABEL[lang]||STAT_LABEL.fr;
    return parsed.why.filter(x=>W[x[0]]).map(([s,v])=>`${L[s]} ${v>0?'+':''}${Math.round(v*10)/10}`).slice(0,4).join(' · ');
  }
  const effEN = x => x.effectEn || x.effect || '';

  // Bonus de set dont l'effet n'a pas de chiffre direct (renforce le palier précédent)
  const SET_HINT = {'Shelterer|4':{st:6}, 'Lonewolf|4':{cd:9,cr:3}, 'Renegade|4':{rel:10,ws:3}, 'Agent|4':{rel:8,fr:4}, 'Bastille|4':{dr:8}, 'Savior|3':{dr:6}, 'Savior|4':{dr:10}, 'Stormweaver|4':{dr:6,hp:3}};
  // ---------- Recherche de l'armure (sets + pièce unique) ----------
  const SLOTS6 = ['Helmet','Mask','Top','Gloves','Bottoms','Shoes'];
  function armorSearch(p, W, allowKey){
    const sets = D.sets.filter(s=>s.name!=='Pièce unique' && s.bonus && s.bonus.length);
    const slotOf = {}; // set -> {slot: id}
    for (const s of sets){ slotOf[s.name]={}; for (const id of s.pieces){ const a=byId[id]; if(a) slotOf[s.name][a.slot]=id; } }
    const cum = {}; // set -> [score(0..4), parsed per level]
    for (const s of sets){
      const arr=[0,0,0,0,0]; const why=[[],[],[],[],[]];
      for (let c=1;c<=4;c++){
        let sc=arr[c-1]; why[c]=why[c-1].slice();
        for (const b of s.bonus) if (b.pieces===c){ const pr=parse(b.effect,p); const h=SET_HINT[s.name+'|'+c]; if(h&&!pr.off) for(const k in h){ pr.out[k]=(pr.out[k]||0)+h[k]; pr.why.push([k,h[k],'set']); } const v=pr.off?0:scoreOf(pr,W); sc+=v; why[c].push({pieces:c,effect:b.effect,score:v,expl:explain(pr,W),off:pr.off}); }
        arr[c]=sc;
      }
      cum[s.name]={score:arr, why};
    }
    const keys = allowKey ? D.armor.filter(a=>a.set==='Pièce unique' && effEN(a)) : [];
    const keyScored = keys.map(a=>{ const pr=parse(effEN(a),p); return {a, score: pr.off?-1:scoreOf(pr,W), expl:explain(pr,W), off:pr.off}; }).filter(k=>k.score>0);
    const patterns = {6:[[4,2],[4,1,1],[3,3],[3,2,1],[2,2,2]], 5:[[4,1],[3,2],[2,2,1],[3,1,1]]};
    const names = sets.map(s=>s.name);
    const results = [];
    const push = r => { if (results.length>=60 && r.score<=results[results.length-1].score) return; results.push(r); results.sort((a,b)=>b.score-a.score); if(results.length>60) results.length=60; };
    const feasible = (alloc, keySlot) => {  // alloc: [[set,count],...] → attribution des emplacements
      const free = SLOTS6.filter(s=>s!==keySlot); const assign = {};
      const rec = (i, left) => {
        if (i===alloc.length) return true;
        const [sn,c]=alloc[i]; const avail = free.filter(sl=>!assign[sl] && slotOf[sn][sl]);
        if (avail.length<c) return false;
        const choose=(start,k,picked)=>{ if(k===0){ picked.forEach(sl=>assign[sl]=sn); if(rec(i+1)) return true; picked.forEach(sl=>delete assign[sl]); return false; }
          for(let j=start;j<avail.length;j++){ if(choose(j+1,k-1,picked.concat(avail[j]))) return true; } return false; };
        return choose(0,c,[]);
      };
      return rec(0) ? assign : null;
    };
    const keyOpts = [null, ...keyScored];
    for (const k of keyOpts){
      const n = k ? 5 : 6; const base = k ? k.score : 0;
      for (const pat of patterns[n]){
        const iter = (i, used, alloc, sc) => {
          if (i===pat.length){ push({score:sc+base, alloc:alloc.slice(), key:k}); return; }
          for (const nm of names){
            if (used.includes(nm)) continue;
            if (i>0 && pat[i]===pat[i-1] && nm < alloc[i-1][0]) continue; // évite les doublons
            const v = cum[nm].score[Math.min(pat[i],4)];
            if (v<=0 && pat[i]>=2) continue;
            alloc.push([nm,pat[i]]); iter(i+1, used.concat(nm), alloc, sc+v); alloc.pop();
          }
        };
        iter(0,[],[],0);
      }
    }
    // vérification des emplacements (sets à 5 pièces) et dédoublonnage
    const out=[]; const seen=new Set();
    for (const r of results){
      const assign = feasible(r.alloc, r.key?r.key.a.slot:null); if (!assign) continue;
      const sig = r.alloc.map(x=>x[0]+x[1]).sort().join('|')+'|'+(r.key?r.key.a.id:'');
      if (seen.has(sig)) continue; seen.add(sig);
      const pieces = {}; for (const sl of SLOTS6){ if (r.key && r.key.a.slot===sl) pieces[sl]=r.key.a.id; else pieces[sl]=slotOf[assign[sl]][sl]; }
      out.push({...r, pieces, why: r.alloc.map(([nm,c])=>({set:nm, count:c, bonus:cum[nm].why[Math.min(c,4)]}))});
      if (out.length>=3) break;
    }
    return out;
  }

  // ---------- Mods + suffixes ----------
  const SUFFIX_VAL = {'Precision':{ws:7.2},'Violent':{cd:12},'Deviant Energy':{st:8},'Survival':{hp:4.8,dr:3.2},'General':{wd:2.4,rel:2},
    'Shrapnel':{kw:8},'Bounce':{kw:8},"The Bull's Eye":{kw:8},'Fast Gunner':{kw:8},'Fortress Warfare':{kw:8},'Burn':{kw:8},'Power Surge':{kw:8},'Frost Vortex':{kw:8},'Unstable Bomber':{kw:8},'Melee Default':{mel:8}};
  function bestSuffix(variants, W, p){
    let best=null, bs=-1;
    for (const v of variants){ const val=SUFFIX_VAL[v]; if(!val) continue;
      if (KW_ORDER.some(k=>KW[k].variant===v) && (!p.kw || KW[p.kw].variant!==v)) continue;
      let s=0; for (const k in val) s+=(W[k]||0)*val[k]; if (s>bs){bs=s;best=v;} }
    return best || variants[0];
  }
  function modsSearch(p, W){
    const res = {};
    const byName = {};
    for (const m of D.mods){ const k=m.slot+'|'+m.name; (byName[k]=byName[k]||{slot:m.slot,name:m.name,effect:m.effect,items:[]}).items.push(m); }
    for (const sl of ['Weapon',...SLOTS6]){
      const cands = Object.values(byName).filter(x=>x.slot===sl).map(x=>{ const pr=parse(x.effect,p); return {...x, score: pr.off?-1:scoreOf(pr,W), expl: explain(pr,W), off:pr.off}; })
        .filter(x=>x.score>1.5).sort((a,b)=>b.score-a.score);
      res[sl] = cands.slice(0,3).map(c=>{ const variants=[...new Set(c.items.map(i=>i.variant))]; const suf=bestSuffix(variants,W,p); const item=c.items.find(i=>i.variant===suf)||c.items[0]; return {...c, suffix:suf, id:item.id, variants}; });
    }
    return res;
  }

  // ---------- Peaux (relevées en jeu, l'effet dépend de la pièce) ----------
  const SKINS = {
    Helmet:[{n:'Golden Wool',fr:'Laine dorée',e:{dr:5},t:{fr:'Réduction des DÉG 1–10 % (variable)',en:'DMG reduction 1–10% (fluctuating)'},v:1},
            {n:'Mountain Wool',fr:'Laine des montagnes',e:{dr:6},t:{fr:'Réduction des DÉG hors points faibles',en:'Non-weakspot DMG reduction'},v:1}],
    Mask:  [{n:'Golden Wool',fr:'Laine dorée',e:{wd:6,st:6},t:{fr:'+12 % dég d\'arme et de statut (répartition variable)',en:'+12% weapon & status DMG (shifting split)'},v:1},
            {n:'Wolf Skin',fr:'Peau de loup',e:{ws:6},t:{fr:'DÉG aux points faibles',en:'Weakspot DMG'},v:1},
            {n:'Jungle Wolf Skin',fr:'Peau de loup de la jungle',e:{wd:6},t:{fr:'DÉG d\'arme',en:'Weapon DMG'},v:1},
            {n:'Mountain Cowhide',fr:'Cuir de vache des montagnes',e:{wd:5},t:{fr:'+8 % dég non élémentaires si endurance ≥ 120',en:'+8% non-elemental DMG at ≥120 stamina'},v:1}],
    Top:   [{n:'Wasteland Wolf Skin',fr:'Peau de loup des terres désolées',e:{mob:8},t:{fr:'Endurance max +20, sprint +5 %',en:'Max stamina +20, sprint +5%'},v:1},
            {n:'Hide',fr:'Peau',e:{mob:3},t:{fr:'Résistances climatiques',en:'Climate resistances'},v:1}],
    Gloves:[{n:'Medical Gloves',fr:'Gants médicaux',e:{dr:4},t:{fr:'+10 % à tous les effets de régénération',en:'+10% to all regeneration effects'},v:1},
            {n:'Beach Crocodile Skin',fr:'Peau de crocodile de plage',e:{mob:6},t:{fr:'Rendement coupe/minage +25 % (coup final)',en:'Logging/mining yield +25% (final strike)'},v:1}],
    Bottoms:[{n:'Coastal Bay Crocodile Skin',fr:'Peau de crocodile des côtes',e:{dr:5},t:{fr:'Réduction des DÉG de statut +5 %',en:'Status DMG reduction +5%'},v:1},
            {n:'Wasteland Wolf Skin',fr:'Peau de loup des terres désolées',e:{mob:8},t:{fr:'Endurance max +20, sprint +5 %',en:'Max stamina +20, sprint +5%'},v:1}],
    Shoes: [{n:'Golden Wool',fr:'Laine dorée',e:{mob:8,dr:2},t:{fr:'Vitesse de roulade 1–15 % (variable)',en:'Roll speed 1–15% (fluctuating)'},v:1},
            {n:'Reindeer Hide',fr:'Peau de renne',e:{mob:5},t:{fr:'Charge max +10',en:'Max load +10'},v:1}],
  };
  function skinsSearch(W){ const r={}; for (const sl of SLOTS6){ const c=SKINS[sl].map(s=>{let v=0; for(const k in s.e) v+=(W[k]||0)*s.e[k]; return {...s,score:v};}).sort((a,b)=>b.score-a.score); r[sl]=c[0]; } return r; }

  // ---------- Déviation, Cradle, nourriture ----------
  const DEV_HINT = {'pyro-dino':{burn:30,st:10},'invincible-sun':{burn:15},'polar-jelly':{vortex:36},'snowsprite':{vortex:30},'chaos-snowsprite':{vortex:32},
    'mr-wish':{bullseye:30},'chaos-mr-wish':{bullseye:32},'mini-feaster':{bounce:30},'shattered-maiden':{bomber:40},'zapamander':{surge:25},
    'lonewolfs-whisper':{wd:21.6},'zapcam':{wd:21.6},'butterflys-emissary':{ws:30},'dr-teddy':{dr:30,hp:10},'festering-gel':{dr:28},'voodoo-doll':{dr:15},'enchanting-void':{mel:25}};
  function devSearch(p, W){
    return D.deviations.filter(d=>d.type==='Combat').map(d=>{
      const h = DEV_HINT[d.id]; let s=0, why=[];
      if (h){ for (const k in h){ if (KW[k]){ if(k===p.kw){ s+=W.kw*h[k]; why.push(STAT_LABEL[lang].kw+' +'+h[k]); } } else { s+=(W[k]||0)*h[k]; if(W[k]) why.push(STAT_LABEL[lang][k]+' +'+h[k]); } } }
      else { const pr=parse(effEN(d),p); if(!pr.off){ s=scoreOf(pr,W)*.6; why=[explain(pr,W)]; } }

      .filter(x=>x.score>0).sort((a,b)=>b.score-a.score).filter((x,i,arr)=>arr.findIndex(y=>y.c.name===x.c.name)===i).slice(0,8);

  const MEAT = {shrapnel:['Viande d\'ours pure','Pure Bear Meat'],bounce:['Volaille pure','Pure Poultry'],bullseye:['Viande de cerf','Venison'],fastgunner:['Viande de lièvre','Hare Meat'],
    fortress:['Viande de tortue fine','Fine Turtle Meat'],burn:['Viande de chèvre pure','Pure Goat Meat'],surge:['Viande de crocodile pure','Pure Crocodile Meat'],vortex:['Bœuf pur','Pure Beef'],bomber:['Porc pur','Pure Pork']};
  function foodHints(p, W, goal){
    const L = lang==='en';
    const out = [];
    if (p.kw) out.push({n: L?`Mixed Fried Hot Dog + ${MEAT[p.kw][1]} + milk`:`Hot-dog frit mixte + ${MEAT[p.kw][0]} + lait`, e: L?`${KW[p.kw].en} DMG +3% (pure meat), slight Max HP (milk). Cook it on the Protoplasm Fusion Stove (+40% effect, +75% duration).`:`DÉG de ${KW[p.kw].fr} +3 % (viande pure), PV max légèrement ↑ (lait). À cuire au Réchaud de fusion de protoplasme (+40 % d'effet, +75 % de durée).`});
    if (goal==='survival') out.push({n: L?'Taco (bear meat) / Malt Ale':'Taco (viande d\'ours) / Bière au malt', e: L?'+100 Max HP (bear meat); Malt Ale: sanity + pollution immunity 30 min.':'+100 PV max (viande d\'ours) ; Bière au malt : santé mentale + immunité pollution 30 min.'});
    else if (p.kw==='shrapnel') out.push({n: L?'Canned Meat':'Viande en boîte (Canned Meat)', e: L?'Shrapnel DMG +10%.':'DÉG de Shrapnel +10 %.'});
    else if (p.fam==='status' || goal==='elem') out.push({n: L?'Whimsical Drink':'Boisson fantasque (Whimsical Drink)', e: L?'Status DMG +25%.':'DÉG de statut +25 %.'});
    else if (goal==='weakspot' || W.ws>=W.cd && W.ws>=W.cr) out.push({n: L?'Assorted Canned Fruit':'Mélange de fruits en conserve', e: L?'Weakspot DMG +25% while sanity > 80%.':'DÉG aux points faibles +25 % si santé mentale > 80 %.'});
    else out.push({n: L?'Stargazy Pie':'Tourte Stargazy (Stargazy Pie)', e: L?'Crit DMG +25% while Energy is full.':'DÉG critiques +25 % si l\'énergie est pleine.'});
    out.push({n: L?'Bone-in Deviated Sausage (bosses)':'Saucisse déviante cuite à l\'os (boss)', e: L?'DMG vs bosses +15%.':'DÉG contre les boss +15 %.'});

  function foodSearch(p, W){

      .filter(x=>x.score>0).sort((a,b)=>b.score-a.score).filter((x,i,arr)=>arr.findIndex(y=>y.f.name===x.f.name)===i).slice(0,2);
  }

  // ---------- Estimation de DPS / indice ----------
  function totals(res, p){

    const a=res.armor[0]; if(a){ a.why.forEach(w=>w.bonus.forEach(b=>{ if(!b.off) addParsed(b.effect); })); if(a.key) addParsed(effEN(a.key.a)); }

    res.foodHints = foodHints(p,W,goal); res.totals = totals(res,p); res.est = estimate(p,res.totals);

  }
  return {run, KW, KW_ORDER, GOALS, STAT_LABEL, STATS, detectKw, profile, SLOTS6};
})();

  const a = r.armor[0];
  const armorHtml = a? `<table><tr><td>${ot('slot')}</td><td></td></tr>${OPT.SLOTS6.map(sl=>{const x=byId[a.pieces[sl]]; return `<tr><td>${ot('slots')[sl]}</td><td style="display:flex;gap:8px;align-items:center">${img(x,'thumb')}<div><b>${esc(x.name)}</b><div class="sm" style="color:var(--ink2);font-size:12px">${x.set==='Pièce unique'?ot('key'):esc(x.set)} · ${x.hp||'?'} ${t('hp')}</div></div></td></tr>`}).join('')}</table>
    ${a.why.map(s=>`<p class="eff"><b>${esc(s.set)} ×${s.count}</b> — ${s.bonus.map(b=>`${b.pieces}p : ${esc(b.effect)}${b.off?` <span class="todo">(${ot('offKw')})</span>`:''}${b.expl?` <span style="color:var(--star)">[${esc(b.expl)}]</span>`:''}`).join(' · ')||'—'}</p>`).join('')}
    ${a.key?`<p class="eff"><b>${ot('key')} : ${esc(a.key.a.name)}</b> — ${esc(eff(a.key.a))} <span style="color:var(--star)">[${esc(a.key.expl)}]</span></p>`:''}`:'<p class="todo">—</p>';
  const alts = r.armor.slice(1).map(x=>`<li>${x.alloc.map(([n,c])=>`${esc(n)} ×${c}`).join(' + ')}${x.key?` + ${esc(x.key.a.name)}`:''} <span class="todo">(${ot('score')} ${Math.round(x.score)} / ${Math.round(a.score)})</span></li>`).join('');
  const modsHtml = `<table><tr><td>${ot('slot')}</td><td>${ot('mod')} &lt;${ot('suffix')}&gt; — ${ot('why')}</td></tr>${['Weapon',...OPT.SLOTS6].map(sl=>{const m=r.mods[sl][0]; if(!m) return `<tr><td>${ot('slots')[sl]}</td><td>—</td></tr>`; const alt=r.mods[sl].slice(1).map(z=>esc(z.name)).join(', ');
      return `<tr><td>${ot('slots')[sl]}</td><td><b>${esc(m.name)}</b> <span style="color:var(--teal)">&lt;${esc(sufL(m.suffix))}&gt;</span><div style="font-size:12px;color:var(--ink2)">${esc(m.effect)}</div><div style="font-size:11.5px;color:var(--star)">${esc(m.expl)}</div>${alt?`<div class="todo" style="font-size:11px">${ot('alt')} : ${alt}</div>`:''}</td></tr>`}).join('')}</table>`;
  const skinsHtml = `<table>${OPT.SLOTS6.map(sl=>{const s=r.skins[sl]; return `<tr><td>${ot('slots')[sl]}</td><td><b>${esc(lang==='fr'?s.fr:s.n)}</b>${lang==='fr'?` <span class="todo">(${esc(s.n)})</span>`:''}<div style="font-size:12px;color:var(--ink2)">${esc(s.t[lang])}</div></td></tr>`}).join('')}</table>`;
  const devHtml = r.dev.map((x,i)=>`<p class="eff">${i===0?'<b>':''}${esc(x.d.name)}${i===0?'</b>':''} — <span style="color:var(--star)">${esc(x.expl)}</span></p>`).join('')||'<p class="todo">—</p>';
  const crHtml = r.cradle.map(x=>`<p class="eff"><b>${esc(x.c.name)}</b> — ${esc(x.c.effect)}</p>`).join('');
  const foodHtml = (r.foodHints||[]).map(x=>`<p class="eff"><b>${esc(x.n)}</b> — ${esc(x.e)}</p>`).join('')||'<p class="todo">—</p>';
  const e=r.est;
  const estHtml = `<div class="big3">${statBox(ot('dps0'),e.dps0??'—')}${statBox(ot('dps1'),e.dps1??'—')}${statBox(r.p.fam==='status'?ot('sgain'):ot('gain'), (r.p.fam==='status'?e.statusGain:e.gain)+' %')}</div>`;
  return `<section class="build">
    <h2>${ot('tab')} — ${esc(w.name)} · ${OPT.GOALS.find(g=>g[0]===r.goal)[1][lang]}</h2>
    <div class="buildbar"><button class="btn primary" onclick="optLoad()">${ot('load')}</button><span class="saved">${!p.kw?ot('noEffect'):''}</span></div>
    <div style="display:flex;flex-direction:column;gap:14px">${prof}
      <div class="summary"><h3>${ot('est')}</h3>${estHtml}</div>
      <div class="summary"><h3>${ot('armor')}</h3>${armorHtml}${alts?`<h3 class="mt">${ot('alt')}</h3><ul style="font-size:12.5px">${alts}</ul>`:''}</div></div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="summary"><h3>${ot('mods')}</h3>${modsHtml}</div>
      <div class="summary"><h3>${ot('skins')}</h3>${skinsHtml}</div>
      <div class="summary"><h3>${ot('dev')}</h3>${devHtml}<h3 class="mt">${ot('cradle')}</h3>${crHtml}<h3 class="mt">${ot('food')}</h3>${foodHtml}</div></div>
    <p style="grid-column:1/3;font-size:11.5px;color:var(--ink3)">${ot('note')}</p>
  </section>`;
}


render();
</script>
</body>
</html>
